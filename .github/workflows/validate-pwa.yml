name: Validate bilingual PWA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  localization-and-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Russian and Kazakh interface, updates, cache
        run: |
          node tests/interface-language.test.cjs
          node tests/translation-updates.test.cjs
          node tests/release-notes.test.cjs
          node scripts/build-css.cjs --check
          node tests/pwa-cache-consistency.test.cjs
          node tests/css-bundle.test.cjs
          node tests/app-update.test.cjs
          node tests/notification-icon.test.cjs
          node tests/notification-header.test.cjs
          node tests/group-settings-visibility.test.cjs
          node tests/college-settings-help-polish.test.cjs
          node tests/home-next-day-layout.test.cjs
          node tests/home-header-divider.test.cjs
          node tests/compact-layout.test.cjs
          node tests/dark-mode.test.cjs
          node tests/blue-theme.test.cjs
          node tests/no-violet-colors.test.cjs
          node tests/banners.test.cjs
          node --check notification-center.js
          node --check notifications-sw.js
