name = "sbp-information-push"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sbp-information-push"
# Deployment workflow replaces this placeholder with the existing/new D1 database UUID.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
